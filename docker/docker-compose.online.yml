# 線上模式（多人使用的伺服器，預設以「內網」方式提供）：與 docker-compose.yml 疊加使用，同一份映像檔
#   docker compose -f docker-compose.yml -f docker-compose.online.yml up -d
# 必填：在同資料夾的 .env 設 OPEN_PETS_ALLOWED_HOSTS=使用者會輸入的網址主機（內網 IP 或主機名稱，逗號分隔；有對外網域就填網域），
#       防 DNS rebinding。例如 OPEN_PETS_ALLOWED_HOSTS=192.168.1.20,pets-server
#
# 內網 HTTPS（建議）：再疊加 docker-compose.https.yml，由 Caddy 用私有 CA 簽發憑證並對內網開放 443：
#   docker compose -f docker-compose.yml -f docker-compose.online.yml -f docker-compose.https.yml up -d
# 對外網際網路或自備反向代理：容器仍只綁本機 127.0.0.1，前面放反向代理（nginx、Caddy、IIS ARR…）並啟用 HTTPS，
# 由代理轉送到 127.0.0.1:8080；範例見 Caddyfile.example、nginx.conf.example。
# 不要把 8080 直接以明文 HTTP 開放到區網或網際網路（若一定要，才用 .env 的 OPEN_PETS_BIND，見 docker-compose.yml）。
services:
  open-pets:
    environment:
      OPEN_PETS_MODE: online
      # 用 :? 讓沒設定時直接報錯，不會在沒有主機限制的情況下對外開放
      OPEN_PETS_ALLOWED_HOSTS: ${OPEN_PETS_ALLOWED_HOSTS:?線上模式必須在 .env 設定 OPEN_PETS_ALLOWED_HOSTS（內網 IP、主機名稱，或對外網域，逗號分隔）}
