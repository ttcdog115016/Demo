# 反向代理範例：nginx（憑證自行準備，例如 certbot 或內部 CA）
# 把 openpets.example.com 與憑證路徑換成你的；網域要與 .env 的 OPEN_PETS_ALLOWED_HOSTS 一致。
# 搭配：docker compose -f docker-compose.yml -f docker-compose.online.yml up -d（容器只綁 127.0.0.1:8080）
server {
    listen 80;
    server_name openpets.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name openpets.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 與應用程式的上傳上限一致（OPEN_PETS_MAX_UPLOAD_MB，預設 1024）
    client_max_body_size 1024M;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;                       # Host 必須原樣轉送，否則 ALLOWED_HOSTS 會擋掉
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;                        # 大檔案直接串流，不先寫到代理的磁碟
        proxy_read_timeout 15m;                             # 大檔案的處理時間可能很長
        proxy_send_timeout 15m;
    }
}
