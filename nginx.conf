server {
    listen 80;
    server_name localhost;

    # 解除 Nginx 預設 1MB 的上傳限制，允許 100MB 檔案
    client_max_body_size 100M;

    # 1. 處理前端 React 畫面 (保留你原本的設定)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # 🌟 解決 React Router SPA 頁面重新整理跳出 404 的問題
        try_files $uri $uri/ /index.html;
    }

    # 2. 處理後端 API 請求，繞過 Vite Proxy 直接轉發
    location /api/ {
        # 將請求轉發給委外的後端 Docker
        proxy_pass http://host.docker.internal:8000/api/;
        
        # 停用 Nginx 暫存，讓大檔案直接串流給後端，大幅提升上傳速度
        proxy_request_buffering off;
        
        # 傳遞真實的 IP 與 Host 資訊給後端
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}