server {
    listen 8080; # ★ 2026-11-03：配合 Dockerfile 改用非 root 之 nginx，改聽 8080
    server_name localhost;

    # 解除 Nginx 預設 1MB 的上傳限制，允許 100MB 檔案
    client_max_body_size 1024M; # ★ 2026-10-29 與後端 OPEN_PETS_MAX_UPLOAD_MB 預設 1024 一致

    # ★ 2026-11-03：ZAP 弱點掃描指出缺少安全標頭、Server 標頭揭露版本，於此補上
    #   各 location 皆未自訂 add_header，故此處設定會套用到全部回應；antd 以 <style> 注入樣式，style-src 需允許 'unsafe-inline'
    #   正式環境若以反向代理提供 HTTPS，請於代理層另加 Strict-Transport-Security
    server_tokens off;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # 1. 處理前端 React 畫面 (保留你原本的設定)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # 🌟 解決 React Router SPA 頁面重新整理跳出 404 的問題
        try_files $uri $uri/ /index.html;
    }

    # 2. 處理後端 API 請求，繞過 Vite Proxy 直接轉發
    location /api/ {
        # 將請求轉發給委外的後端 Docker
        proxy_pass http://host.docker.internal:8000/api/;
        
        # 停用 Nginx 暫存，讓大檔案直接串流給後端，大幅提升上傳速度
        proxy_request_buffering off;

        # ★ 2026-10-29：X-Quality-Report／X-Budget-Report 報告放在回應標頭，欄位多時超過預設 4–8 KB
        proxy_buffer_size 64k;
        proxy_buffers 8 64k;
        
        # 傳遞真實的 IP 與 Host 資訊給後端
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}