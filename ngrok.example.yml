version: 3
agent:
  authtoken: "<在此填入你的 ngrok authtoken，勿提交此檔>"
endpoints:
  - name: pets-frontend
    url: https://wheat-stratus-gecko.ngrok-free.dev
    upstream:
      url: 5173
