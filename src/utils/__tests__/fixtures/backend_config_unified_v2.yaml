# ==============================================================================
# Open-PETs 大包設定檔 — 完整參數範例
#
# 本檔列出所有區塊、所有參數與每個參數的全部可選值。
# 註解中以「A | B | C」表示該參數的可選值，並標明未填時的預設。
#
# 一份設定檔可同時描述五種處理；呼叫某個入口時，該入口需要的區塊必須
# enabled: true，其餘區塊開不開都不影響。各入口取用的區塊如下：
#
#   preprocess         → preprocess
#   k-anonymity        → k_anonymity
#   dp                 → differential_privacy
#   risk-k-anonymity   → risk_attacks ＋ k_anonymity
#   risk-dp            → risk_attacks ＋ differential_privacy
#   risk-cap           → risk_cap
#
# 對象資料為同資料夾的 範例資料.csv（50,000 列 × 13 欄）。處理順序為先執行
# preprocess，其餘五個入口皆以 preprocess 之輸出為對象資料；CAP 前後對比另需
# 範例資料_去識別後.csv（即 preprocess 之輸出再經 k-anonymity 之結果）。
# 六個入口皆可直接執行，本檔所有參數均為實際生效的設定；同一參數之其他可選值
# 與未實際套用之功能列於註解。
# 同內容的 JSON 版為 config_範例_JSON統合版.json（JSON 無註解語法）。
# ==============================================================================

# ── 根層：三個參數，為各區塊共用 ─────────────────────────────────────────────
version: open-pets-2.0.0-example   # 任意字串；會寫進稽核紀錄，供事後追查本次用的是哪一版設定
dataset: 範例資料                   # 任意字串；資料集名稱，同樣寫進稽核紀錄
input_format: csv                  # csv | json | jsonl | excel | sqlite（資料庫連線字串於呼叫時另行指定，不寫於此）
                                   # 未填→依檔名副檔名判定，供沒有副檔名的檔案使用


# ══════════════════════════════════════════════════════════════════════════════
# 區塊一：資料前處理（preprocess）
# ══════════════════════════════════════════════════════════════════════════════
preprocess:
  enabled: true              # true | false
  algorithm: sha3-256        # sha256 | sha3-256 | sha3-512；未填→sha3-256
                             # 整份清單共用一組演算法，不逐欄指定

  # columns 是一張由上往下依序執行的清單，同一個欄位可以出現多次。
  # 以下示範九項前處理功能；slice、impute 兩項之寫法列於清單末之註解。
  columns:

    # 1. hash：雜湊假名化，輸出完整十六進位字串（不截短）
    - column: 姓名
      actions:
        - action: hash
          params:
            salt: use_timestamp      # 任意字串 | use_timestamp（保留字，改用系統取的時間戳，整份清單共用同一個）
                                     # 未填或填空字串→用 .env 的 OPEN_PETS_DEFAULT_SALT；.env 也沒設→不加鹽

    # 2. normalize：文字正規化（先統一寫法，同一人之身分證號方得同一雜湊值）
    - column: 身分證號
      actions:
        - action: normalize
          params:
            case: upper              # upper | lower（只影響英文字母）
            width: half              # half（全形轉半形）| full（半形轉全形）
                                     # case 與 width 皆選填，但至少要給一個
                                     # 本欄每十筆有一筆為全形寫法，轉換後與其餘筆一致
        - action: hash
          params:
            salt: use_timestamp

    # 3. trim：去空白          4. regex_replace：正規表示式取代
    - column: 地址
      actions:
        - action: trim
          params:
            mode: edges              # edges（只去頭尾）| all（連字串中間的空白一併去除）
        - action: regex_replace
          params:
            pattern: "(?<=區).*$"    # Python 正規表示式；此例去除「區」以後的部分，地址截至行政區
            replacement: ""          # 取代成的字串，可為空字串（＝刪除）

    # 5. anchor_truncate：以錨點字元為基準保留一側
    - column: 出生日期
      actions:
        - action: anchor_truncate
          params:
            anchor: "-"              # 單一字元
            direction: after         # after（取最後一個錨點，保留錨點與其後方）
                                     # before（取由前往後第一個錨點，保留錨點與其前方）
            keep: 0                  # 錨點那一側要保留幾個字元（含錨點本身）；0＝連錨點一起刪
                                     # 此例＝1985-03-21 → 1985-03（去掉日，錨點另一側完全不動）

    # 6. clamp：上下界截斷    7. cast（type: int）：型態轉換為整數
    - column: 醫療費用
      actions:
        - action: clamp
          params:
            min: 0                   # 選填
            max: 100000              # 選填；min 與 max 至少要給一個，且 min 不可大於 max
                                     # 剛好等於邊界的不動（規格指的是「超出」），空格不動
                                     # 本欄每二十筆有一筆離群值，會被壓回上界
        - action: cast
          params:
            type: int                # int | float | bool
            rounding: round          # floor（無條件捨去）| round（四捨五入）| ceil（無條件進位）
                                     # 選填，且只有 type: int 能寫；不寫而資料含小數→報錯
                                     # （捨去或進位屬實質決定，系統不代為選擇）

    # 8. cast（type: float）：型態轉換為小數
    - column: 檢驗值_血糖
      actions:
        - action: cast
          params:
            type: float              # type: float 不可寫 rounding（小數不取整）
                                     # type: bool 須另寫 true_values 與 false_values（必填，
                                     # 比對忽略大小寫、兩者不可重複；清單以外的值原樣不動），不可寫 rounding

    # 9. fill_default：空值填入固定值
    - column: 職業
      actions:
        - action: fill_default
          params:
            value: 未填              # 要填入的值；型態依欄位而定（本欄約 5% 為空值）

    # 10. drop_nulls：刪去該欄為空的整列（此功能無參數）
    - column: 保險別
      actions:
        - action: drop_nulls
          params: {}                 # 無參數；寫任何參數都會被擋下（本欄約 3% 為空值）

    # ── 未於本範例套用之功能，寫法如下 ──
    # slice：字串截斷
    #   - action: slice
    #     params:
    #       side: left               # left | right（從哪一側「刪掉」字元，不是保留）
    #       count: 1                 # 要刪掉的字元數，至少 1；中文一個字算一個
    # impute：空值推補
    #   - action: impute
    #     params:
    #       strategy: mean           # ffill（以前一筆填補）| bfill（以後一筆填補）
    #                                # interpolate（線性內插，限數值欄）| mean（以平均值填補，限數值欄）


# ══════════════════════════════════════════════════════════════════════════════
# 區塊二：K-匿名化（k_anonymity）
# ══════════════════════════════════════════════════════════════════════════════
k_anonymity:
  enabled: true                      # true | false

  # ── 整體參數 ────────────────────────────────────────────────────────────────
  k: 5                               # 等價類最小列數；未填→5
  l: 2                               # l-多樣性門檻；選填，未填→不做 l 檢測
  t: 0.7                             # t-相近性門檻；選填，未填→不做 t 檢測
                                     # 門檻越小越嚴格；準識別欄位切得細、等價類小的時候，
                                     # 分佈本來就難貼近全體，此範例取 0.7
  suppression_limit_percent: 20      # 最大允許抑制率（百分比）；未填→20
  limit_exceeded_action: allow_with_warning   # stop_and_error（超過上限即中止並報錯）
                                              # allow_with_warning（超過上限仍輸出，於報告提醒）
                                              # 未填→allow_with_warning
  suppression_method: cell_suppression        # cell_suppression（只把該格換成填充值，列保留）
                                              # row_suppression（整列刪除）
                                              # 未填→row_suppression
  cell_fill: star                             # star（填 *）| missing（填空值）
                                              # 未填→star；僅 cell_suppression 時生效
  algorithm: sha3-256                         # sha256 | sha3-256 | sha3-512；未填→sha3-256

  # ── 逐欄宣告 ────────────────────────────────────────────────────────────────
  # role     : identifier | quasi_identifier | sensitive | non_sensitive
  # type     : numeric | categorical | temporal | string
  # strategy : mask | partial | hash | generalize | remove | clear | none
  #            未填→依 role 套預設（identifier→hash、quasi_identifier→generalize、
  #            sensitive→none、non_sensitive→none）
  columns:

    # strategy: hash —— 假名化（identifier 的預設處理）
    姓名:
      role: identifier
      type: string
      strategy: hash

    # strategy: clear —— 值清空、欄位保留（供下游資料表欄位固定、欄位消失會匯入失敗的情境）
    身分證號:
      role: identifier
      type: string
      strategy: clear
      # ★ 識別欄位只支援 hash、remove、clear 三種；設成其他策略會一律回退為 hash。
      #   strategy: remove —— 連同欄位一併移除；要移除整欄時改寫 remove 即可。

    # 數值型 QI —— 以 bins 逐段寫明區間
    年齡:
      role: quasi_identifier
      type: numeric

    # 類別型 QI —— 以 generalization_matrices 的階層表往上收
    地址:
      role: quasi_identifier
      type: categorical
      cell_fill_value: 臺北市        # 值抑制時本欄要填入的值（此例為泛化樹頂層）
                                     # 未填→沿用區塊層的 cell_fill；不可為空字串
                                     # 只對 quasi_identifier 生效，且僅 cell_suppression 時用得到

    # 日期型 QI —— 以 levels 宣告粒度階梯（泛化到年）
    出生日期:
      role: quasi_identifier
      type: temporal

    # 日期型 QI —— 泛化到時，再以 time_periods 換成時段標籤
    就診時間:
      role: quasi_identifier
      type: temporal

    # sensitive —— l-多樣性與 t-相近性的檢測目標，預設不做任何處理
    疾病:
      role: sensitive
      type: categorical

    # strategy: none —— 原值輸出
    職業:
      role: non_sensitive
      type: categorical
      strategy: none

    醫療費用:
      role: non_sensitive
      type: numeric
      strategy: none

    檢驗值_血糖:
      role: non_sensitive
      type: numeric
      strategy: none

    就醫次數:
      role: non_sensitive
      type: numeric
      strategy: none

    婚姻狀況:
      role: non_sensitive
      type: categorical
      strategy: none

    保險別:
      role: non_sensitive
      type: categorical
      strategy: none

    # ── 未於本範例套用之策略與欄位參數，寫法如下（適用於非識別欄位）──
    # strategy: mask —— 全遮蔽為固定字元
    #   mask_char: "#"               # 遮蔽字元；未填→*
    #   mask_length: 6               # 全遮蔽輸出的固定字元數；未填→沿用原值長度
    # strategy: partial —— 部分遮蔽，保留一部分字元
    #   mask_char: "*"               # 遮蔽字元；未填→*
    #   mask_mode: prefix            # prefix（保留前綴）| suffix（保留後綴）
    #                                # length（字串泛化為字元長度分級，供 generalize 用）
    #                                # 未填→prefix
    #   keep_chars: 3                # 保留的字元數，其餘遮蔽；未填→3

  # ── 泛化設定：數值用 bins 或 rounding（二擇一），日期用 levels ──
  # 字串型 QI 以 mask_mode: length 搭配 bin_size（字元長度級距，未填→5）依長度分級
  generalization_hierarchies:
    年齡:
      # bins 與 rounding 同一欄只能擇一；兩者皆不給＝該欄不泛化（報告會提醒），同時給則報錯
      bins:                          # 逐段寫明「從幾、到幾、叫什麼」；min 為 null＝無下界，max 為 null＝無上界
        - {min: null, max: 40, label: 40歲以下}
        - {min: 40, max: 44, label: 40-43歲}
        - {min: 44, max: null, label: 44歲以上}
      # rounding: 10                 # 另一種數值泛化寫法：四捨五入至該數字的倍數，輸出仍為數字
      #                              # 如身高 178 → 180

    # 字串型 QI 之長度分級寫法（該欄 columns 須設 mask_mode: length）：
    # 欄位名稱:
    #   bin_size: 5                  # 字元長度級距；未填→5

    出生日期:
      levels: [day, month, year]     # 由細到粗列出要泛化到的粒度
                                     # 可用粒度：second | minute | hour | day | month | year
                                     # 層級 1＝第一項、層級 2＝第二項，依此類推；層級 0＝不泛化
                                     # 須由細到粗排列、不可重複，排反會被擋下

    就診時間:
      levels: [hour, day, month]     # 泛化到時（層級 1），供下方時段對照表生效
      time_periods:                  # 選填，把一天之內的時間換成標籤
        - {min: "00:00", max: "06:00", label: 凌晨}
        - {min: "06:00", max: "12:00", label: 上午}
        - {min: "12:00", max: "18:00", label: 下午}
        - {min: "18:00", max: "24:00", label: 晚間}
                                     # 界線寫時間字串，故非整點亦可；對照表只在泛化到
                                     # 時／分／秒 時生效，泛化到日以上不擋、於報告提醒

  # ── 類別型 QI 的自訂階層：{欄位: {mapping: {原始值: [原始值, 上一層, ...]}}} ──
  generalization_matrices:
    地址:
      mapping:                       # 陣列第 0 格是原始值，往後每格是更上一層
        臺北市中正區: [臺北市中正區, 臺北市]
        臺北市信義區: [臺北市信義區, 臺北市]
        臺北市南港區: [臺北市南港區, 臺北市]
        臺北市大安區: [臺北市大安區, 臺北市]
        臺北市松山區: [臺北市松山區, 臺北市]
        臺北市板橋區: [臺北市板橋區, 臺北市]

  # ── 各 QI 欄位的泛化層級：單一整數（固定）或 [min, max]（範圍，由系統在範圍內尋解）──
  # 0 表示不泛化，數字越大泛化程度越高。數值型 QI 不吃本設定（切法已由 bins/rounding 寫死）。
  qi_generalization_levels:
    地址: [0, 1]                     # 範圍寫法：系統在第 0～1 層（行政區／縣市）之間尋找滿足 k 的最小泛化
    出生日期: 3                      # 固定寫法：泛化到 levels 的第 3 項（year）
    就診時間: 1                      # 固定寫法：泛化到 levels 的第 1 項（hour），再套時段對照表


# ══════════════════════════════════════════════════════════════════════════════
# 區塊三：差分隱私（differential_privacy）
# ══════════════════════════════════════════════════════════════════════════════
differential_privacy:
  enabled: true                      # true | false

  # ── 整體參數 ────────────────────────────────────────────────────────────────
  accumulated_epsilon: 0.0           # 到目前為止已用掉的 ε；未填→0
  accumulated_delta: 0.0             # 到目前為止已用掉的 δ；未填→0
                                     # ★引擎只讀不寫。跑完的新累計值由預算報告帶出，
                                     #   須自行填回下一次要用的設定檔，否則預算不會累計。
  default_delta: 1.0e-5              # 全域 δ，補沒設 delta_budget 的 continuous／datetime 欄
                                     # ★須寫 1.0e-5；寫成 1e-5 會被 YAML 當字串

  # ── 逐欄預算 ────────────────────────────────────────────────────────────────
  # type: continuous（數值加噪，離散型 Laplace／Gaussian，由 δ 決定用哪一個）
  #     | categorical（k-RR 翻面，純 ε 機制）
  #     | datetime（日期抖動）
  column_budgets:

    # continuous —— δ 大於 0，採離散型 Gaussian
    年齡:
      type: continuous
      epsilon_budget: 2.0            # 必填，須大於 0
      delta_budget: 1.0e-5           # 選填，須大於等於 0 且小於 1
                                     # 未給→由 default_delta 補；明確設 0＝指定要純 ε 保證
                                     #（此時採離散型 Laplace，全域值不得覆蓋）
      sensitivity: 1.0               # 敏感度
      minimum_unit: 1                # 公開的最小單位（刻度）：加噪前全部除以它變整數，加噪後乘回
                                     # 未給→1
      clipping_bounds: [0, 120]      # 選填，加噪後的合理上下界 [min, max]；未給→不做超界處理
      out_of_bounds_strategy: clamp  # clamp（截斷至邊界）| wrap（繞至另一端）| fold（以邊界為對稱點反射）
                                     # 有給 clipping_bounds 卻沒給策略時→clamp

    # continuous —— δ 明確設 0，採離散型 Laplace
    醫療費用:
      type: continuous
      epsilon_budget: 1.0
      delta_budget: 0.0              # 明確設 0＝要求純 ε 保證（離散型 Laplace）
      sensitivity: 5000.0
      minimum_unit: 100              # 以百元為刻度
      clipping_bounds: [0, 100000]
      out_of_bounds_strategy: fold

    # categorical —— k-RR 為純 ε 機制，不可寫 delta_budget 與 sensitivity（寫了會被擋）
    地址:
      type: categorical
      epsilon_budget: 2.0

    # datetime —— 四個日期欄專用參數全列
    就診時間:
      type: datetime
      epsilon_budget: 2.0
      delta_budget: 1.0e-5
      sensitivity: 10.0              # ★單位跟著 noise_unit 走：noise_unit 為 minute 時＝10 分鐘
      noise_unit: minute             # day | hour | minute | second；未給→day
                                     # 只有 datetime 能寫，寫在別的型別上會被擋
      noise_step: 5                  # 幾個 noise_unit 算一格；此例＝以 5 分鐘為刻度。未給→1
      time_clipping_bounds: ["2025-06-16 00:00:00", "2025-06-16 23:59:59"]  # 選填，加噪後的合理範圍
      time_out_of_bounds_strategy: clamp                                    # clamp | wrap | fold；未給→clamp


# ══════════════════════════════════════════════════════════════════════════════
# 區塊四：再識別風險三攻擊（risk_attacks）
#          指認性、連結性、推斷性；供 risk-k-anonymity 與 risk-dp 兩個入口使用
# ══════════════════════════════════════════════════════════════════════════════
risk_attacks:
  enabled: true                      # true | false

  # role 只收 quasi_identifier（攻擊面）與 sensitive（推斷性的目標）兩值，
  # identifier／non_sensitive 不參與三攻擊，宣告了會被擋下。
  # sensitive 須恰好一個：0 個無從評估、多個無法擇一。
  columns:
    年齡:
      role: quasi_identifier
      type: numeric                  # numeric | categorical | temporal | string
    地址:
      role: quasi_identifier
      type: categorical
    職業:
      role: quasi_identifier
      type: categorical
    婚姻狀況:
      role: quasi_identifier
      type: categorical
    疾病:
      role: sensitive
      type: categorical

  # 連結性攻擊的自訂特徵子集；選填，未給整個 linkability 時由 QI 池對半自動導出。
  # A、B 須成對提供、各至少一欄，且不可重疊（垂直切割要求一欄只能在一邊）。
  linkability:
    A: [年齡, 婚姻狀況]
    B: [地址, 職業]

  # 子群體限定；選填，未給＝評估全體。寫法為「欄位: 條件」。
  subgroup:
    年齡: {min: 38, max: 45}         # 數值區間條件：閉區間，min／max 皆含，可只給一側
    職業: [工程師, 醫師, 教師]        # 類別集合條件：直接寫成清單（成員需落在清單內）
                                     # 多個欄位並列＝AND，須同時滿足；整段省略＝評估全體

  # ── 實驗參數 ────────────────────────────────────────────────────────────────
  n_iter: 500                        # 指認性攻擊迭代次數；未填→500
  ctrl_ratio: 0.2                    # holdout（ctrl）切分比例；未填→0.2
  seed: 42                           # 隨機種子；未填→42
  n_subset: 500                      # 連結性攻擊評估樣本數；未填→500
  n_repeats: 3                       # 重複實驗輪數；未填→1（單輪，不做交叉驗證）
  overlap_ratio: 0.1                 # 跨輪 ctrl 抽樣重疊比例；未填→0，僅 n_repeats 大於 1 時生效


# ══════════════════════════════════════════════════════════════════════════════
# 區塊五：再識別風險 CAP 前後對比（risk_cap）
#          同時上傳原始與去識別後兩份現成資料，不切分、不產生合成資料
# ══════════════════════════════════════════════════════════════════════════════
risk_cap:
  enabled: true                      # true | false

  # 本區塊只收四個參數。CAP 不切分、不產合成資料、沒有隨機性，
  # risk_attacks 的六個實驗參數它一個都不收，寫了會被擋下。
  columns:
    年齡:
      role: quasi_identifier
      type: numeric
    地址:
      role: quasi_identifier
      type: categorical
    職業:
      role: quasi_identifier
      type: categorical
    婚姻狀況:
      role: quasi_identifier
      type: categorical
    疾病:
      role: sensitive
      type: categorical

  subgroup:
    職業: [工程師, 醫師, 教師]        # ★ CAP 是拿原始與「去識別後」兩份比對，子群體條件要挑
                                     #   兩份都還讀得懂的欄位。此處用未經處理的 職業；若改用
                                     #   已泛化成區間標籤的 年齡（如「40-43歲」）下數值區間條件，
                                     #   去識別後那份會篩不到任何一列。

  processed_format: csv              # csv | json | jsonl | excel
                                     # 去識別後那份資料的格式，與根層 input_format 分開宣告：
                                     # 原始與去識別後兩份可能來自不同來源，不保證同一種格式
