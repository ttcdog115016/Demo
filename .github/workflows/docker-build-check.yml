name: Docker image build check

# PR 修改了映像檔相關的檔案時，建置映像檔並跑冒煙測試（不推送、不簽章、不建立 Release）。
# 目的：Dockerfile、後端、前端，或 Dependabot 的基底映像檔升級，在合併前就知道映像檔還能不能建置與啟動。
#   ci.yml 只跑前後端測試，不會建置映像檔；沒有這項檢查，映像檔壞了要到發版才會發現。
# 發版流程（docker-image.yml）用同一份冒煙測試腳本 docker/smoke_test.sh，兩邊不會漂移。
#
# 刻意不加入 ruleset 的「必須通過的檢查」：這個 workflow 只在下列路徑有變更時才執行，
# 沒觸發的 PR（例如只改文件）會因為缺少這項檢查而無法合併。
on:
  pull_request:
    branches: [ main, master ]
    paths:
      - 'docker/**'
      - 'backend/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/docker-build-check.yml'

permissions:
  contents: read

concurrency:
  group: docker-build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 建置參數與發版流程（docker-image.yml 的 Build image）相同；版本號只是標記，不會發佈
      - name: Build image
        run: |
          docker buildx build -f docker/Dockerfile \
            --build-arg "OPEN_PETS_VERSION=0.0.0-pr-check" \
            --build-arg "OPEN_PETS_SOURCE_URL=https://github.com/$GITHUB_REPOSITORY" \
            --build-arg "OPEN_PETS_REVISION=$GITHUB_SHA" \
            -t open-pets-app:pr-check --load .

      - name: Smoke test (health + all modes)
        run: bash docker/smoke_test.sh open-pets-app:pr-check
