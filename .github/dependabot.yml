# 追蹤已固定在 digest 的基底映像檔與 GitHub Actions 版本，有新版時自動提 PR。
# 固定 digest 後基底不會自己更新；沒有這份設定，映像檔會慢慢收不到上游的安全修補。
version: 2
updates:
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    # 只自動提「同一個版本線」的 digest 與安全更新，換版本線要人工評估後再改 Dockerfile：
    #   - python：後端鎖定的 numpy、pandas、scipy、scikit-learn 等要有該 Python 版本的預編譯檔才能建置
    #     （映像檔裡沒有編譯器）。目前用 3.12；換版本前要先升級後端相依並跑完整測試。
    #   - node：只用在前端建置階段。目前用 24（LTS）；每年 LTS 換版時再手動升級，避免自動跳到非 LTS 的版本。
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # 前端 npm 套件：小版本與修補版合併成一個 PR（每個 PR 都要過 build-and-test 才能合併），大版本要人工評估
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # 後端 Python 套件（backend/pyproject.toml 與 uv.lock）：同上。numpy、scipy 等需要預編譯檔，
  # 合併前由 backend-tests 與 docker-build-check（含冒煙測試）把關。
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
